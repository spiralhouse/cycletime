# =============================================================================
# Gradle CI/CD Performance Configuration (GitHub Actions)
# SPI-478: CI-optimized settings for GitHub Actions runners
# =============================================================================

# Kotlin Code Style
kotlin.code.style=official

# =============================================================================
# GitHub Actions Runner Optimizations (2 CPU, 7GB RAM)
# =============================================================================

# Conservative memory settings for CI environment
# GitHub Actions runners have limited memory, so we use conservative settings
org.gradle.jvmargs=-Xmx3072m \
  -XX:MaxMetaspaceSize=768m \
  -XX:+UseG1GC \
  -XX:G1HeapRegionSize=16m \
  -XX:+UseStringDeduplication \
  -XX:+UseCompressedOops \
  -XX:+UseCompressedClassPointers \
  -Dfile.encoding=UTF-8

# =============================================================================
# CI Performance Settings
# =============================================================================

# Enable Gradle daemon in CI (contrary to old advice, it helps with multiple gradle invocations)
org.gradle.daemon=true

# Parallel execution optimized for GitHub Actions (2 CPU cores)
org.gradle.parallel=true
org.gradle.workers.max=2

# =============================================================================
# Build Caching - Critical for CI Performance (SPI-475)
# =============================================================================

# Local build cache (ephemeral in CI but still useful within single build)
org.gradle.caching=true

# Configuration cache - major CI startup time improvement
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# File system watching disabled in CI (not needed)
org.gradle.vfs.watch=false

# =============================================================================
# CI-Optimized Build Cache Configuration (SPI-475)
# =============================================================================

# Enhanced cache settings for CI environment
org.gradle.caching.debug=false
org.gradle.configuration-cache.max-problems=50

# Kotlin compiler caching for CI
kotlin.compiler.execution.strategy=in-process
kotlin.caching.enabled=true

# Dependency resolution optimizations for CI
systemProp.org.gradle.internal.repository.cached.metadata.sources=true
org.gradle.dependency.verification.console=quiet

# Cache statistics for CI monitoring (enable for performance analysis)
# org.gradle.internal.tasks.cache.statistics=true

# =============================================================================
# Kotlin Compiler Optimizations for CI
# =============================================================================

# Incremental compilation (helps with partial rebuilds in CI)
kotlin.incremental=true

# Kotlin daemon with conservative memory settings
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseG1GC

# kapt optimizations
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# =============================================================================
# CI-Specific Optimizations
# =============================================================================

# Don't auto-download sources/docs in CI
org.gradle.java.installations.auto-download=false

# Shorter timeouts for CI (fail fast on network issues)
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000

# Disable console output optimizations (not needed in CI)
org.gradle.console=plain

# Disable welcome message and other user-oriented features
org.gradle.welcome=never

# =============================================================================
# GitHub Actions Environment Variables Integration
# =============================================================================

# These are automatically set by GitHub Actions:
# CI=true (detected by Gradle for CI optimizations)
# GITHUB_ACTIONS=true
# RUNNER_OS, RUNNER_ARCH for platform-specific optimizations

# =============================================================================
# Future Remote Build Cache Configuration
# =============================================================================

# Placeholder for future Gradle Enterprise or other remote cache
# org.gradle.caching.remote=true
# org.gradle.caching.remote.url=https://your-cache-server