name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: Only run on specific file changes  
    # paths:
    #   - "src/**/*.kt"
    #   - "src/**/*.kts"
    #   - "src/**/*.java"
    #   - "build.gradle.kts"
    #   - "settings.gradle.kts"

# Prevent duplicate Claude review runs
concurrency:
  group: claude-review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read code reviewer personality
        id: read-personality
        run: |
          if [ -f .claude/agents/code-reviewer.md ]; then
            # Read the file content and store in environment variable
            {
              echo 'REVIEWER_PERSONALITY<<EOF'
              cat .claude/agents/code-reviewer.md
              echo 'EOF'
            } >> $GITHUB_ENV
          else
            echo "REVIEWER_PERSONALITY=Please review this pull request and provide constructive feedback." >> $GITHUB_ENV
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.REVIEWER_PERSONALITY }}

