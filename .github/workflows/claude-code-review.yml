name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: Only run on specific file changes  
    # paths:
    #   - "src/**/*.kt"
    #   - "src/**/*.kts"
    #   - "src/**/*.java"
    #   - "build.gradle.kts"
    #   - "settings.gradle.kts"

# Prevent duplicate Claude review runs on the same PR
# This will cancel any in-progress review when a new commit is pushed to the PR
concurrency:
  # Group by PR number to ensure only one review runs per PR at a time
  group: claude-review-pr-${{ github.event.pull_request.number }}
  # Cancel previous review when new commits are pushed
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Required to read code for review
      pull-requests: write     # Required to comment on PRs
      issues: write           # Required for issue interactions
      id-token: write         # Required for OIDC authentication
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read code reviewer personality
        id: read-personality
        run: |
          if [ -f .claude/agents/code-reviewer.md ]; then
            # Read the file content and store in environment variable
            {
              echo 'REVIEWER_PERSONALITY<<EOF'
              cat .claude/agents/code-reviewer.md
              echo 'EOF'
            } >> $GITHUB_ENV
          else
            echo "REVIEWER_PERSONALITY=Please review this pull request and provide constructive feedback." >> $GITHUB_ENV
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.REVIEWER_PERSONALITY }}

