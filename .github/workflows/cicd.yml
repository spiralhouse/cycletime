name: CI/CD Pipeline

on:
  push:
    # Only trigger on main/develop branches for direct pushes (merges)
    # This prevents duplicate runs when both push and pull_request events occur
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'SESSION_SUMMARY.md'
      - 'STRATEGY.md'
      - 'PROJECT_STRUCTURE.md'
      - 'PERFORMANCE_BASELINE_RESULTS.md'
      - 'TEST_PLAN_PARALLEL_TDD.md'
      - 'TEST_SUITES.md'
      - 'sub-agents-conversation.txt'
  pull_request:
    # CI runs on PRs targeting main/develop - covers all feature branches
    # This is the PRIMARY CI trigger for feature branches
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'SESSION_SUMMARY.md'
      - 'STRATEGY.md'
      - 'PROJECT_STRUCTURE.md'
      - 'PERFORMANCE_BASELINE_RESULTS.md'
      - 'TEST_PLAN_PARALLEL_TDD.md'
      - 'TEST_SUITES.md'
      - 'sub-agents-conversation.txt'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip GitHub release creation'
        required: false
        default: 'false'

# Enhanced concurrency control to prevent duplicate runs and save resources
# This will cancel any in-progress runs when a new push is made to the same branch
concurrency:
  # Use PR number for pull requests, branch name for pushes
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel previous runs on the same branch when a new one starts
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  # Matrix strategy configuration
  JAVA_VERSIONS: '["21", "22"]'
  OS_MATRIX: '["ubuntu-latest", "macos-latest"]'
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true
  # Comprehensive caching strategy
  BUILD_CACHE_VERSION: "v2"
  GRADLE_CACHE_VERSION: "v2"
  DEPENDENCY_CACHE_VERSION: "v1"
  DOCKER_CACHE_VERSION: "v2"
  TEST_CACHE_VERSION: "v1"
  # Docker BuildKit optimizations
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain
  # GraalVM Configuration for Native Builds
  GRAALVM_VERSION: '21'  # Use latest 21.x (NOT 21.0.8 - that version doesn't exist)
  GRAALVM_DISTRIBUTION: 'graalvm-community'

jobs:
  # ========================================
  # CI STAGE - Runs on all branches
  # ========================================
  
  # Version calculation - always run for consistency
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      run_tests: ${{ steps.changes.outputs.run_tests }}
      should_tag: ${{ steps.version.outputs.should_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true  # Explicitly fetch tags for git-semver-plugin

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check for code changes
        id: changes
        run: |
          echo "🔍 Checking for relevant changes..."

          # Always run tests for Dependabot PRs (security validation required)
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "🤖 Dependabot PR detected - running full security validation pipeline"
            echo "run_tests=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -E '\.(kt|kts|java|gradle)$|src/|build\.gradle|settings\.gradle|gradle\.properties|gradle/.*\.toml|gradle/|\.github/workflows/'; then
            echo "✅ Code changes detected - will run full pipeline"
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ No code changes detected - will skip tests but run version calculation"
            echo "run_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-create version tag on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🏷️ Auto-creating version tag for main branch merge..."

          # Get the last commit message to determine version bump type
          commit_message=$(git log -1 --pretty=%B)
          echo "📝 Commit message: $commit_message"

          # Check if this commit should create a version tag
          should_tag=false

          if [[ "$commit_message" =~ ^feat(\(.*\))?!:|^BREAKING[\ -]CHANGE: ]]; then
            echo "🚨 BREAKING CHANGE detected - will create major version tag"
            should_tag=true
          elif [[ "$commit_message" =~ ^feat(\(.*\))?: ]]; then
            echo "✨ Feature commit detected - will create minor version tag"
            should_tag=true
          elif [[ "$commit_message" =~ ^fix(\(.*\))?: ]]; then
            echo "🐛 Fix commit detected - will create patch version tag"
            should_tag=true
          elif [[ "$commit_message" =~ ^perf(\(.*\))?: ]]; then
            echo "⚡ Performance commit detected - will create patch version tag"
            should_tag=true
          else
            echo "⏭️ Non-versioning commit (docs, chore, ci, build, etc.) - skipping tag creation"
            should_tag=false
          fi

          if [ "$should_tag" = true ]; then
            # Calculate next version using printCleanVersion task
            # This task strips SNAPSHOT and build metadata from git-semver-plugin output
            # Use 'tail -1' to get only the last line (handles Gradle wrapper download output edge case)
            next_version=$(./gradlew printCleanVersion --quiet --no-configuration-cache | tail -1)

            if [[ -n "$next_version" && "$next_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "📦 Creating tag: v$next_version"

              # Configure git for tagging
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              # Check if tag already exists to prevent conflicts
              if git rev-parse "v$next_version" >/dev/null 2>&1; then
                echo "⚠️ Tag v$next_version already exists, skipping tag creation"
              else
                # Create annotated tag with error handling
                tag_message="Release $next_version

          Automated release tag created by CI/CD pipeline.

          Commit: ${{ github.sha }}
          Trigger: $commit_message"

                if git tag -a "v$next_version" -m "$tag_message"; then
                  echo "✅ Tag v$next_version created successfully"

                  # Push tag to repository with retry logic
                  retry_count=0
                  max_retries=3
                  push_success=false

                  while [ $retry_count -lt $max_retries ]; do
                    if git push origin "v$next_version"; then
                      echo "✅ Tag v$next_version pushed successfully"
                      push_success=true
                      break
                    else
                      retry_count=$((retry_count + 1))
                      if [ $retry_count -lt $max_retries ]; then
                        echo "⚠️ Tag push failed (attempt $retry_count/$max_retries), retrying in 2 seconds..."
                        sleep 2
                      fi
                    fi
                  done

                  if [ "$push_success" = false ]; then
                    echo "❌ Failed to push tag v$next_version after $max_retries attempts"
                    # Clean up local tag on push failure
                    git tag -d "v$next_version"
                    exit 1
                  fi
                else
                  echo "❌ Failed to create tag v$next_version"
                  exit 1
                fi
              fi
            else
              echo "⚠️ Failed to calculate next version: $next_version"
              echo "⏭️ Skipping tag creation due to version calculation failure"
            fi
          fi

      - name: Calculate version
        id: version
        run: |
          # Wait for tag propagation to GitHub's backend (eventual consistency)
          echo "⏳ Waiting 3 seconds for tag propagation..."
          sleep 3

          # Re-fetch tags after potential tag creation and propagation delay
          echo "🔄 Fetching tags from remote..."
          git fetch --tags --force

          # Verify tag propagation for main branch builds
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
            echo "📋 Latest tag after fetch: $latest_tag"
          fi

          # Extract clean semantic version using printCleanVersion task
          # This task strips SNAPSHOT and build metadata suffixes (SPI-892)
          # Use 'tail -1' to get only the last line (handles Gradle wrapper download output edge case)
          version=$(./gradlew printCleanVersion --quiet --no-configuration-cache | tail -1)

          # Fallback - use printVersion if printCleanVersion fails
          if [[ -z "$version" ]]; then
            echo "⚠️ printCleanVersion failed, trying printVersion..."
            version=$(./gradlew printVersion --quiet --no-configuration-cache --rerun-tasks | grep "^version:" | cut -d' ' -f2)
          fi

          # Final fallback - use git describe if gradle fails completely
          if [[ -z "$version" ]]; then
            echo "⚠️ Gradle version extraction failed, using git describe fallback"
            # Try to get the latest tag
            latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -n "$latest_tag" && "$latest_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              # Valid semantic version tag found
              version=$(git describe --tags --always --dirty)
              # Clean up version format (remove 'v' prefix if present)
              version="${version#v}"
            else
              # No valid tags, create version from commit count
              commit_count=$(git rev-list --count HEAD 2>/dev/null || echo "1")
              short_sha=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
              version="0.1.0-dev.${commit_count}+sha.${short_sha}"
              echo "No semantic version tags found, using: $version"
            fi
          fi

          echo "version=$version" >> $GITHUB_OUTPUT

          # For main branch builds, always consider it a release if we just created a tag
          # This allows the release job to run and create GitHub releases
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Check if this exact commit is tagged
            if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "should_tag=false" >> $GITHUB_OUTPUT  # Already tagged
            else
              # Not tagged yet - printCleanVersion always returns clean X.Y.Z format
              # Release determination is handled by commit message patterns (lines 136-149)
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "should_tag=true" >> $GITHUB_OUTPUT
            fi
          else
            # For non-main branches, always treat as release for artifact generation
            # printCleanVersion ensures clean version format regardless of branch
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "should_tag=false" >> $GITHUB_OUTPUT
          fi

          # Validate version format (clean semantic versioning only)
          # printCleanVersion should only output X.Y.Z format (no suffixes)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $version"
            echo "Expected clean semantic version format: MAJOR.MINOR.PATCH (no suffixes)"
            echo "printCleanVersion task should have stripped SNAPSHOT and metadata"
            exit 1
          fi

          echo "📦 Version: $version"
          echo "🚀 Is Release: Yes (printCleanVersion always produces clean versions)"

  # Compile job that runs first to build all code and test classes
  compile:
    name: Compile Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version
    if: needs.version.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Comprehensive dependency caching
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-jdk21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-jdk21-
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-

      # Kotlin compilation cache
      - name: Cache Kotlin compilation
        uses: actions/cache@v4
        with:
          path: |
            build/kotlin
            build/tmp/kotlin-classes
          key: kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-ubuntu-jdk21-${{ hashFiles('src/**/*.kt', 'build.gradle.kts') }}
          restore-keys: |
            kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-ubuntu-jdk21-
            kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-ubuntu-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Compile all code and tests
        run: |
          echo "🔨 Compiling all code and test classes"
          echo "📊 Cache status:"
          echo "  Gradle cache: $([ -d ~/.gradle/caches ] && echo 'HIT' || echo 'MISS')"
          echo "  Kotlin cache: $([ -d build/kotlin ] && echo 'HIT' || echo 'MISS')"
          ./gradlew compileKotlin compileTestKotlin compileIntegrationTestKotlin compileSystemTestKotlin --no-build-cache --configuration-cache --no-daemon

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-artifacts
          path: |
            build/classes/
            build/kotlin/
            build/tmp/kotlin-classes/
            build/resources/
          retention-days: 1

  # Unit tests - uses compiled artifacts
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compile
    if: needs.compile.result == 'success'
    # Environment variable to prevent koverXmlReport from running integration tests
    # This ensures the unit-tests job only runs unit tests, not integration tests
    env:
      SKIP_INTEGRATION_COVERAGE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Restore Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-jdk21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-jdk21-
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-

      # Download compiled artifacts from compile job
      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: build/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run unit tests with coverage
        run: |
          echo "🚀 Running unit tests with coverage using pre-compiled artifacts"
          ./gradlew unitTest koverXmlReport -x compileKotlin -x compileTestKotlin -x compileIntegrationTestKotlin -x compileSystemTestKotlin --no-build-cache --configuration-cache --no-daemon

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            build/reports/tests/unitTest/
            build/test-results/unitTest/
          retention-days: 7

      - name: Verify coverage report exists
        run: |
          echo "🔍 Checking coverage report generation..."
          if [ -f "./build/reports/kover/report.xml" ]; then
            echo "✅ Coverage report found: $(ls -lh ./build/reports/kover/report.xml)"
            echo "📊 Report size: $(wc -c < ./build/reports/kover/report.xml) bytes"
            echo "📈 First 10 lines of coverage report:"
            head -10 ./build/reports/kover/report.xml
          else
            echo "❌ Coverage report not found at ./build/reports/kover/report.xml"
            echo "📁 Contents of build/reports/:"
            find ./build/reports/ -type f -name "*.xml" || echo "No XML files found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          # Additional configuration for better integration
          directory: ./build/reports/kover/
          root_dir: ./
          working-directory: ./

      - name: Fallback coverage upload (if primary fails)
        if: failure()
        run: |
          echo "⚠️ Primary CodeCov upload failed, attempting direct upload..."
          if command -v curl &> /dev/null && [ -f "./build/reports/kover/report.xml" ]; then
            echo "🔄 Using curl to upload coverage report directly..."
            curl -s https://codecov.io/bash | bash -s -- \
              -t "${{ secrets.CODECOV_TOKEN }}" \
              -f "./build/reports/kover/report.xml" \
              -F "unittests" \
              -n "codecov-fallback" \
              -v || echo "❌ Fallback upload also failed"
          else
            echo "⚠️ Curl not available or coverage report missing, skipping fallback"
          fi

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/test-results/unitTest/*.xml
          flags: unit-tests
          name: unit-test-results
          fail_ci_if_error: false
          verbose: true

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compile
    if: needs.compile.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: build/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run integration tests with coverage
        run: |
          echo "🔗 Running integration tests with coverage using pre-compiled artifacts"
          ./gradlew integrationTest koverXmlReport -x compileKotlin -x compileTestKotlin -x compileIntegrationTestKotlin -x compileSystemTestKotlin --no-build-cache --configuration-cache --no-daemon

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/
          retention-days: 7

      - name: Verify coverage report exists
        run: |
          echo "🔍 Checking coverage report generation..."
          if [ -f "./build/reports/kover/report.xml" ]; then
            echo "✅ Coverage report found: $(ls -lh ./build/reports/kover/report.xml)"
            echo "📊 Report size: $(wc -c < ./build/reports/kover/report.xml) bytes"
            echo "📈 First 10 lines of coverage report:"
            head -10 ./build/reports/kover/report.xml
          else
            echo "❌ Coverage report not found at ./build/reports/kover/report.xml"
            echo "📁 Contents of build/reports/:"
            find ./build/reports/ -type f -name "*.xml" || echo "No XML files found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          flags: integration
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          # Additional configuration for better integration
          directory: ./build/reports/kover/
          root_dir: ./
          working-directory: ./

      - name: Fallback coverage upload (if primary fails)
        if: failure()
        run: |
          echo "⚠️ Primary CodeCov upload failed, attempting direct upload..."
          if command -v curl &> /dev/null && [ -f "./build/reports/kover/report.xml" ]; then
            echo "🔄 Using curl to upload coverage report directly..."
            curl -s https://codecov.io/bash | bash -s -- \
              -t "${{ secrets.CODECOV_TOKEN }}" \
              -f "./build/reports/kover/report.xml" \
              -F "integration" \
              -n "codecov-fallback" \
              -v || echo "❌ Fallback upload also failed"
          else
            echo "⚠️ Curl not available or coverage report missing, skipping fallback"
          fi

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/test-results/integrationTest/*.xml
          flags: integration-tests
          name: integration-test-results
          fail_ci_if_error: false
          verbose: true

  # System Tests
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compile
    if: needs.compile.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: build/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run system tests
        run: |
          echo "🎩 Running system tests using pre-compiled artifacts"
          ./gradlew systemTest -x compileKotlin -x compileTestKotlin -x compileIntegrationTestKotlin -x compileSystemTestKotlin --no-build-cache --configuration-cache --no-daemon

      - name: Upload system test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-results
          path: |
            build/reports/tests/systemTest/
            build/test-results/systemTest/
          retention-days: 7

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/test-results/systemTest/*.xml
          flags: system-tests
          name: system-test-results
          fail_ci_if_error: false
          verbose: true

  # Code quality checks - runs on all changes
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run Detekt
        run: |
          echo "🔍 Running code quality checks"
          ./gradlew detekt --build-cache --configuration-cache --no-daemon
        continue-on-error: true

      - name: Upload Detekt results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7

  # Security scanning - runs on all changes
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run dependency vulnerability scan
        continue-on-error: true  # Temporarily non-blocking due to NVD API issues
        run: |
          echo "🔒 Running security vulnerability scan with NVD API"
          ./gradlew dependencyCheckAnalyze \
            --build-cache \
            --configuration-cache \
            --no-daemon \
            -Dnvd.api.key="${{ secrets.NVD_API_KEY }}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: build/reports/
          retention-days: 7

  # Native binary builds - runs on main branch only after tests pass
  native-build:
    name: Native Build - ${{ matrix.platform.name }}
    needs: [version, unit-tests, integration-tests, system-tests]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.unit-tests.result == 'success' &&
      needs.integration-tests.result == 'success' &&
      needs.system-tests.result == 'success'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS ARM64
            os: macos-14
            artifact_name: macos-aarch64
          - name: macOS x86_64
            os: macos-13
            artifact_name: macos-x86_64
          - name: Linux x86_64
            os: ubuntu-latest
            artifact_name: linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '${{ env.GRAALVM_VERSION }}'
          distribution: '${{ env.GRAALVM_DISTRIBUTION }}'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Verify GraalVM Installation
        run: |
          echo "☕ Java version:"
          java -version
          echo ""
          echo "🔧 Native-image version:"
          native-image --version
          echo ""
          echo "📍 GRAALVM_HOME: $GRAALVM_HOME"
          echo "📍 JAVA_HOME: $JAVA_HOME"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-native-${{ runner.os }}-${{ matrix.platform.artifact_name }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-native-${{ runner.os }}-${{ matrix.platform.artifact_name }}-
            gradle-native-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Native Image
        run: |
          echo "🔨 Building native image for ${{ matrix.platform.name }}"
          echo "📦 Version: ${{ needs.version.outputs.version }}"
          echo "🏗️  Architecture: ${{ matrix.platform.artifact_name }}"

          # Build native image with full optimizations
          ./gradlew nativeCompile --no-configuration-cache --no-daemon -Pversion=${{ needs.version.outputs.version }}

      - name: Verify Native Binary
        shell: bash
        run: |
          echo "🔍 Verifying native binary..."

          # Find the generated binary
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BINARY="build/native/nativeCompile/cycletime-server.exe"
          else
            BINARY="build/native/nativeCompile/cycletime-server"
          fi

          if [[ ! -f "$BINARY" ]]; then
            echo "❌ Binary not found at: $BINARY"
            echo "📁 Contents of build/native/nativeCompile/:"
            ls -la build/native/nativeCompile/ || echo "Directory does not exist"
            exit 1
          fi

          echo "✅ Binary found: $BINARY"
          echo "📊 Binary size: $(du -h "$BINARY" | cut -f1)"

          # Make binary executable
          chmod +x "$BINARY"

          # Rename binary to include version and platform
          mv "$BINARY" "${BINARY}-${{ needs.version.outputs.version }}-${{ matrix.platform.artifact_name }}"
          BINARY="${BINARY}-${{ needs.version.outputs.version }}-${{ matrix.platform.artifact_name }}"

          # Save binary path for next steps
          echo "BINARY_PATH=$BINARY" >> $GITHUB_ENV

      - name: Run Smoke Tests
        shell: bash
        run: |
          echo "🧪 Running smoke tests on native binary..."

          # Start server in background
          $BINARY_PATH --server.port=38080 > smoke-test.log 2>&1 &
          SERVER_PID=$!

          echo "Server PID: $SERVER_PID"

          # Wait for server to start (max 10 seconds)
          for i in {1..10}; do
            sleep 1
            if ps -p $SERVER_PID > /dev/null 2>&1; then
              echo "✅ Server process is running"
              break
            else
              echo "❌ Server process died during startup"
              cat smoke-test.log
              exit 1
            fi
          done

          # Poll health endpoint until ready (max 30 seconds)
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -sf --max-time 5 http://localhost:38080/health > /dev/null 2>&1; then
              echo "✅ Server is ready after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start within 30 seconds"
              cat smoke-test.log
              exit 1
            fi
            sleep 1
          done

          # Test health endpoint
          echo "Testing health endpoint..."
          if curl -f -s http://localhost:38080/health > health-response.json; then
            echo "✅ Health endpoint responded"
            cat health-response.json
          else
            echo "❌ Health endpoint failed"
            cat smoke-test.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Test MCP endpoint with strict error handling
          echo "Testing MCP endpoint..."
          HTTP_CODE=$(curl -sf --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:38080/mcp || echo "000")

          if [[ "$HTTP_CODE" =~ ^(200|400|405)$ ]]; then
            echo "✅ MCP endpoint exists (HTTP $HTTP_CODE)"
          elif [[ "$HTTP_CODE" =~ ^(500|502|503|504|404|000)$ ]]; then
            echo "❌ MCP endpoint error (HTTP $HTTP_CODE)"
            cat smoke-test.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          else
            echo "⚠️  MCP endpoint returned unexpected HTTP $HTTP_CODE (non-blocking)"
          fi

          # Cleanup
          echo "Stopping server..."
          kill $SERVER_PID 2>/dev/null || true
          sleep 2

          echo "✅ Smoke tests passed!"

      - name: Upload Smoke Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.platform.artifact_name }}
          path: |
            smoke-test.log
            health-response.json
          retention-days: 7

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: native-binary-${{ matrix.platform.artifact_name }}-${{ needs.version.outputs.version }}
          path: ${{ env.BINARY_PATH }}
          retention-days: 30

  # ========================================
  # CD STAGE - Only runs on main branch
  # ========================================

  # Build application - CD stage
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, unit-tests, integration-tests, system-tests, quality]
    # Only run CD build on main branch with successful tests
    if: |
      github.ref == 'refs/heads/main' &&
      needs.unit-tests.result == 'success' &&
      needs.integration-tests.result == 'success' &&
      needs.system-tests.result == 'success' &&
      needs.quality.result == 'success'

    steps:
      # Fetch full git history for git-semver plugin to calculate correct version
      # Without fetch-depth: 0 and fetch-tags: true, git-semver falls back to 0.0.1-SNAPSHOT
      # This caused release v0.3.2 to contain incorrectly versioned artifacts (SPI-911)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Fetch full git history for git-semver plugin
          fetch-tags: true      # Fetch all version tags

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: build/

      - name: Build application JAR and distributions
        run: |
          echo "🔨 Building application artifacts (version: ${{ needs.version.outputs.version }})"
          ./gradlew buildFatJar assembleDist -x compileKotlin -x compileTestKotlin -x compileIntegrationTestKotlin -x compileSystemTestKotlin -x test --no-build-cache --configuration-cache --no-daemon

      - name: Verify JAR exists
        run: |
          test -f build/libs/cycletime-server.jar
          echo "JAR size: $(du -h build/libs/cycletime-server.jar)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ needs.version.outputs.version }}
          path: |
            build/libs/*.jar
            build/distributions/
          retention-days: 30

  # Build and push container - CD stage
  container:
    name: Build and Push Container
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only run on main branch after successful build
    if: |
      github.ref == 'refs/heads/main' && 
      needs.build.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.version.outputs.version }}
          path: build/libs/

      - name: Verify JAR exists before container build
        run: |
          echo "🔍 Verifying JAR exists before Docker build..."
          
          # Check for JAR in expected location
          if [[ -f "build/libs/cycletime-server.jar" ]]; then
            echo "✅ JAR file verified: $(du -h build/libs/cycletime-server.jar)"
          # Check if artifact download created nested structure (legacy fix)
          elif [[ -f "build/libs/libs/cycletime-server.jar" ]]; then
            echo "⚠️ Found JAR in nested structure, moving to correct location..."
            mv build/libs/libs/*.jar build/libs/
            rmdir build/libs/libs
            echo "✅ JAR file moved and verified: $(du -h build/libs/cycletime-server.jar)"
          else
            echo "❌ JAR file not found!"
            echo "Contents of build/libs/:"
            ls -la build/libs/ 2>/dev/null || echo "build/libs/ directory does not exist"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/spiralhouse/cycletime
          tags: |
            # Version tags (for all builds)
            type=raw,value=${{ needs.version.outputs.version }}
            # Latest tag (only for releases)
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release == 'true' }}
            # Dev environment tag (for main branch builds)
            type=raw,value=dev,enable=true
            # SHA tags for tracking
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=CycleTime Server
            org.opencontainers.image.description=CycleTime project orchestration framework with MCP integration
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/spiralhouse/cycletime
            org.opencontainers.image.source=https://github.com/spiralhouse/cycletime
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            deployment.environment=dev
            deployment.version=${{ needs.version.outputs.version }}
            deployment.commit=${{ github.sha }}
            deployment.branch=${{ github.ref_name }}
            deployment.build-timestamp=${{ github.run_id }}
            deployment.trigger=push-to-main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

      - name: Container deployment trigger
        run: |
          echo "🐳 Container pushed to GHCR successfully!"
          echo "🚀 External CD system will detect new container and handle deployment"
          echo ""
          echo "📦 Container Information:"
          echo "  Registry: ghcr.io/spiralhouse/cycletime"
          echo "  Version: ${{ needs.version.outputs.version }}"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Build: ${{ github.run_id }}"
          echo ""
          echo "🏷️ Dev Deployment Tag: ghcr.io/spiralhouse/cycletime:dev"
          echo "📋 Deployment Metadata (in container labels):"
          echo "  - deployment.environment=dev"
          echo "  - deployment.version=${{ needs.version.outputs.version }}"
          echo "  - deployment.commit=${{ github.sha }}"
          echo "  - deployment.branch=${{ github.ref_name }}"
          echo "  - deployment.build-timestamp=${{ github.run_id }}"
          echo ""
          echo "⚙️ External deployment system will:"
          echo "  1. Detect new 'dev' tag in GHCR"
          echo "  2. Pull ghcr.io/spiralhouse/cycletime:dev"
          echo "  3. Deploy to dev environment"
          echo "  4. Perform health checks"
          echo "  5. Complete deployment pipeline"
          echo ""
          echo "✅ CI/CD pipeline complete - deployment handoff successful"

  # Create GitHub Release - CD stage
  release:
    name: Create GitHub Release
    needs: [version, build, native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only create release for production versions on main branch
    if: |
      github.ref == 'refs/heads/main' &&
      needs.version.outputs.is_release == 'true' &&
      github.event.inputs.skip_release != 'true' &&
      needs.build.result == 'success' &&
      needs.native-build.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true  # Explicitly fetch tags for changelog generation

      - name: Generate changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Capture and cleanup changelog
        id: capture
        run: |
          echo "📝 Capturing changelog from CHANGELOG.md..."

          # Verify file exists before capture
          [ -f "CHANGELOG.md" ] || { echo "❌ ERROR: CHANGELOG.md not generated"; exit 1; }

          echo "✅ CHANGELOG.md found, capturing content..."
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT || { echo "❌ ERROR: Failed to read CHANGELOG.md"; exit 1; }
          echo "EOF" >> $GITHUB_OUTPUT

          echo "🗑️ Deleting CHANGELOG.md to prevent git commit..."
          rm CHANGELOG.md || { echo "❌ ERROR: Failed to delete CHANGELOG.md"; exit 1; }

          echo "✅ Changelog captured and file cleaned up successfully"

      - name: Verify no changelog file remains
        run: |
          echo "🔍 Verifying CHANGELOG.md was properly deleted..."

          if [ -f "CHANGELOG.md" ]; then
            echo "❌ ERROR: CHANGELOG.md still exists after cleanup!"
            echo "This file must NOT be committed to git history."
            exit 1
          fi

          echo "✅ Confirmed: No CHANGELOG.md file in working directory"
          echo "✅ Safe to proceed with release creation"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.version.outputs.version }}
          path: build-artifacts/

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-binary-*-${{ needs.version.outputs.version }}
          path: native-binaries/

      - name: Prepare release artifacts
        run: |
          echo "📦 Preparing release artifacts..."

          # List downloaded artifacts
          echo "Build artifacts:"
          ls -la build-artifacts/ || true

          echo ""
          echo "Native binaries:"
          ls -la native-binaries/ || true

          # Flatten native binary directory structure
          cd native-binaries
          find . -type f -exec mv {} . \;
          find . -type d -empty -delete

          echo ""
          echo "Flattened native binaries:"
          ls -lh

          # Generate checksums for native binaries
          echo ""
          echo "🔐 Generating checksums..."
          if command -v sha256sum &> /dev/null; then
            sha256sum cycletime-server-* > checksums-sha256.txt
          elif command -v shasum &> /dev/null; then
            shasum -a 256 cycletime-server-* > checksums-sha256.txt
          fi

          if [ -f checksums-sha256.txt ]; then
            echo "Checksums:"
            cat checksums-sha256.txt
          fi

          cd ..

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          echo "🚀 Creating release for version: $version"

          # Create release with artifacts (JAR + native binaries + checksums)
          gh release create "v$version" \
            --draft \
            --title "Release $version" \
            --notes "${{ steps.capture.outputs.changelog }}" \
            --target "${{ github.sha }}" \
            build-artifacts/libs/*.jar \
            build-artifacts/distributions/*.tar \
            build-artifacts/distributions/*.zip \
            native-binaries/cycletime-server-* \
            native-binaries/checksums-sha256.txt

          echo "✅ Release v$version created with JAR and native binaries"

  # ========================================
  # VALIDATION & REPORTING
  # ========================================

  # Final validation and summary
  validate:
    name: Pipeline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version, unit-tests, integration-tests, system-tests, quality, security, build, container, release]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "# CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Is Release**: ${{ needs.version.outputs.is_release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## CI Stage Results (All Branches)" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Branch Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version Calculation | ${{ needs.version.result }} | All branches |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} | All branches |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} | All branches |" >> $GITHUB_STEP_SUMMARY
          echo "| System Tests | ${{ needs.system-tests.result }} | All branches |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.quality.result }} | All branches |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} | All branches |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## CD Stage Results (Main Branch Only)" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application Build | ${{ needs.build.result }} | Main branch + tests pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Build & Push | ${{ needs.container.result }} | Main branch + build success |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.release.result }} | Main branch + release version |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Branch-specific summary
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "🚀 **Main Branch Deployment Pipeline**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.container.result }}" == "success" ]]; then
              echo "✅ **Container pushed to GHCR** - dev deployment automatically triggered!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🏷️ **Dev Tag**: \`ghcr.io/spiralhouse/cycletime:dev\` (mutable - overwrites on each main build)" >> $GITHUB_STEP_SUMMARY
              echo "📦 **All Available Tags**: \`${{ needs.version.outputs.version }}\`, \`dev\`, \`sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚙️ **What happens next**:" >> $GITHUB_STEP_SUMMARY
              echo "- External CD system watches for \`dev\` tag changes" >> $GITHUB_STEP_SUMMARY  
              echo "- Automatically pulls new \`dev\` image from GHCR" >> $GITHUB_STEP_SUMMARY
              echo "- Deploys to dev environment with health checks" >> $GITHUB_STEP_SUMMARY
              echo "- Expected deployment time: < 5 minutes" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ "${{ needs.release.result }}" == "success" ]]; then
              echo "🎉 **Production release v${{ needs.version.outputs.version }} created!**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "🔧 **Feature Branch Validation**" >> $GITHUB_STEP_SUMMARY
