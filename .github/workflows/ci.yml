name: Kotlin CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true

jobs:
  # Quality checks and tests
  test:
    name: Tests and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Generate coverage report
        run: ./gradlew koverXmlReport --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          flags: unittests
          name: kotlin-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Upload Detekt results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7

  # Build application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew build --no-daemon

      - name: Verify JAR exists
        run: |
          test -f build/libs/jcvd-server.jar
          echo "JAR size: $(du -h build/libs/jcvd-server.jar)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/
            build.gradle.kts
            settings.gradle.kts
            Dockerfile
            README.md
            LICENSE
          retention-days: 7

  # Docker build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        run: docker build -t jcvd:test .

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d --name jcvd-test -p 8080:8080 jcvd:test
          
          # Wait for startup
          sleep 10
          
          # Test health endpoint (when implemented)
          # docker exec jcvd-test curl -f http://localhost:8080/health || echo "Health check not yet implemented"
          
          # Show container logs
          docker logs jcvd-test
          
          # Stop container
          docker stop jcvd-test
          docker rm jcvd-test

      - name: Check image size
        run: |
          echo "Docker image size:"
          docker images jcvd:test --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

  # Integration tests (when we have them)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: false  # Disabled until integration tests are implemented

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Run dependency vulnerability scan
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: build/reports/
          retention-days: 7

  # Final validation
  validate:
    name: Final Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, quality, build, docker, security]

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Validate build completion
        run: |
          echo "✅ Tests passed"
          echo "✅ Code quality checks completed"
          echo "✅ Application built successfully"
          echo "✅ Docker image created"
          echo "✅ Security scan completed"
          echo ""
          echo "🎉 All CI checks passed successfully!"

  # Notify on failure
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test, quality, build, docker, security, validate]
    if: failure()

    steps:
      - name: Report failure
        run: |
          echo "❌ Kotlin CI pipeline failed!"
          echo "Please check the failed jobs and fix the issues."
          echo "Common issues:"
          echo "- Test failures"
          echo "- Code quality violations"
          echo "- Build compilation errors"
          echo "- Docker build issues"
          echo "- Security vulnerabilities"
          exit 1