name: Kotlin CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'SESSION_SUMMARY.md'
      - 'STRATEGY.md'
      - 'PROJECT_STRUCTURE.md'
      - 'PERFORMANCE_BASELINE_RESULTS.md'
      - 'TEST_PLAN_PARALLEL_TDD.md'
      - 'TEST_SUITES.md'
      - 'sub-agents-conversation.txt'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'SESSION_SUMMARY.md'
      - 'STRATEGY.md'
      - 'PROJECT_STRUCTURE.md'
      - 'PERFORMANCE_BASELINE_RESULTS.md'
      - 'TEST_PLAN_PARALLEL_TDD.md'
      - 'TEST_SUITES.md'
      - 'sub-agents-conversation.txt'
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true
  # Comprehensive caching strategy (SPI-475)
  BUILD_CACHE_VERSION: "v2"
  GRADLE_CACHE_VERSION: "v2"
  DEPENDENCY_CACHE_VERSION: "v1"
  DOCKER_CACHE_VERSION: "v1"
  TEST_CACHE_VERSION: "v1"

jobs:
  # Unit Tests - Fast feedback
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Comprehensive dependency caching (SPI-475)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Kotlin compilation cache
      - name: Cache Kotlin compilation
        uses: actions/cache@v4
        with:
          path: |
            build/kotlin
            build/tmp/kotlin-classes
          key: kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/**/*.kt', 'build.gradle.kts') }}
          restore-keys: |
            kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-

      # Test results cache for unit tests
      - name: Cache test results
        uses: actions/cache@v4
        with:
          path: |
            build/test-results/unitTest
            build/reports/tests/unitTest
          key: unit-test-results-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/test/**/*.kt', 'src/main/**/*.kt') }}
          restore-keys: |
            unit-test-results-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Copy CI-optimized properties
          gradle-home-cache-includes: |
            caches
            notifications
          gradle-home-cache-excludes: |
            caches/jars-*
            caches/transforms-*
          # Enable build cache
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties (SPI-475)
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Check for code changes
        id: changes
        run: |
          echo "🔍 Checking for relevant changes..."
          if git diff --name-only HEAD~1 HEAD | grep -E '\.(kt|kts|java|gradle)$|src/|build\.gradle|settings\.gradle|gradle\.properties'; then
            echo "✅ Code changes detected - running tests"
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ No code changes detected - skipping tests"
            echo "run_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        if: steps.changes.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Running unit tests (code changes detected)"
          echo "📊 Cache status before build:"
          echo "  Gradle cache: $([ -d ~/.gradle/caches ] && echo 'HIT' || echo 'MISS')"
          echo "  Kotlin cache: $([ -d build/kotlin ] && echo 'HIT' || echo 'MISS')"
          echo "  Test cache: $([ -d build/test-results/unitTest ] && echo 'HIT' || echo 'MISS')"
          ./gradlew unitTest --build-cache --configuration-cache --no-daemon

      - name: Skip unit tests
        if: steps.changes.outputs.run_tests == 'false' && github.event_name != 'workflow_dispatch'
        run: |
          echo "⏭️ Skipping unit tests - no code changes detected"
          echo "Only documentation or configuration files were modified"

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            build/reports/tests/unitTest/
            build/test-results/unitTest/
          retention-days: 7

  # Integration Tests - Database and service interactions
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    # Only run if unit tests ran (indicating code changes)
    if: needs.unit-tests.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Reuse dependency caching from unit tests
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Integration test specific caches
      - name: Cache integration test results
        uses: actions/cache@v4
        with:
          path: |
            build/test-results/integrationTest
            build/reports/tests/integrationTest
          key: integration-test-results-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/test/kotlin/io/spiralhouse/jcvd/integration/**/*.kt', 'src/main/**/*.kt') }}
          restore-keys: |
            integration-test-results-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run integration tests
        run: |
          echo "🔗 Running integration tests (code changes detected)"
          ./gradlew integrationTest --build-cache --configuration-cache --no-daemon

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/
          retention-days: 7

  # System Tests - Performance and end-to-end
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    # Only run if unit tests ran (indicating code changes)
    if: needs.unit-tests.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Reuse dependency caching
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # System test specific caches (conservative caching due to performance sensitivity)
      - name: Cache system test results
        uses: actions/cache@v4
        with:
          path: |
            build/test-results/systemTest
            build/reports/tests/systemTest
          key: system-test-results-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/test/kotlin/io/spiralhouse/jcvd/performance/**/*.kt', 'src/main/**/*.kt', 'src/main/resources/application.conf') }}
          restore-keys: |
            system-test-results-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run system tests
        run: |
          echo "🎩 Running system tests (code changes detected)"
          ./gradlew systemTest --build-cache --configuration-cache --no-daemon

      - name: Upload system test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-results
          path: |
            build/reports/tests/systemTest/
            build/test-results/systemTest/
          retention-days: 7

  # Test coverage and reports
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, integration-tests, system-tests]
    # Only run if tests ran (indicating code changes)
    if: always() && (needs.unit-tests.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Comprehensive caching for coverage analysis
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Coverage report caching
      - name: Cache coverage reports
        uses: actions/cache@v4
        with:
          path: |
            build/reports/kover
            build/reports/jacoco
          key: coverage-reports-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/**/*.kt') }}
          restore-keys: |
            coverage-reports-${{ env.TEST_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run all tests for coverage
        run: |
          echo "📊 Running all tests for coverage analysis"
          ./gradlew testAll --build-cache --configuration-cache --no-daemon

      - name: Generate coverage report
        run: |
          echo "📊 Generating coverage report"
          ./gradlew koverXmlReport --build-cache --configuration-cache --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          flags: unittests
          name: kotlin-coverage
          fail_ci_if_error: false

      - name: Upload aggregated test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregated-test-results
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/kover/
          retention-days: 7

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run quality checks for any changes (including documentation)
    # Quality checks should run even for doc-only changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Quality checks caching
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Detekt results caching
      - name: Cache Detekt results
        uses: actions/cache@v4
        with:
          path: |
            build/reports/detekt
          key: detekt-results-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/**/*.kt', 'config/detekt/detekt.yml') }}
          restore-keys: |
            detekt-results-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run Detekt
        run: |
          echo "🔍 Running code quality checks"
          ./gradlew detekt --build-cache --configuration-cache --no-daemon
        continue-on-error: true

      - name: Upload Detekt results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7

  # Build application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-coverage, quality, unit-tests]
    # Build only when code changes detected or manual trigger
    if: always() && (needs.unit-tests.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Build artifacts caching
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Build output caching
      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            build/classes
            build/libs
            build/kotlin
            build/tmp
          key: build-outputs-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('src/**/*.kt', 'build.gradle.kts') }}
          restore-keys: |
            build-outputs-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Build application
        run: |
          echo "🔨 Building application (code changes detected)"
          ./gradlew build --build-cache --configuration-cache --no-daemon

      - name: Verify JAR exists
        run: |
          test -f build/libs/jcvd-server.jar
          echo "JAR size: $(du -h build/libs/jcvd-server.jar)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/
            build.gradle.kts
            settings.gradle.kts
            Dockerfile
            README.md
            LICENSE
          retention-days: 7

  # Docker build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, unit-tests]
    # Build Docker image only when code changes detected
    if: needs.unit-tests.outputs.run_tests == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Docker BuildKit setup for advanced caching (SPI-475)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      # Reuse Gradle caches
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Download build artifacts from build job
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Build application
        run: |
          echo "🔨 Building application for Docker"
          ./gradlew build --build-cache --configuration-cache --no-daemon

      # Docker BuildKit with comprehensive caching
      - name: Build Docker image with BuildKit cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jcvd:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d --name jcvd-test -p 8080:8080 jcvd:test
          
          # Wait for startup
          sleep 10
          
          # Test health endpoint (when implemented)
          # docker exec jcvd-test curl -f http://localhost:8080/health || echo "Health check not yet implemented"
          
          # Show container logs
          docker logs jcvd-test
          
          # Stop container
          docker stop jcvd-test
          docker rm jcvd-test

      - name: Check image size
        run: |
          echo "Docker image size:"
          docker images jcvd:test --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

  # Legacy integration placeholder (replaced by separate integration-tests job)
  # integration:
  #   name: Integration Tests (Legacy)
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   needs: [build]
  #   if: false  # Disabled - replaced by integration-tests job above

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Security scans should run on all changes to catch dependency vulnerabilities

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Security scanning caching
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-${{ runner.os }}-

      # Cache security scan results (dependency check database)
      - name: Cache security scan database
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/dependency-check-data
            build/reports/dependency-check-report.html
          key: security-scan-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            security-scan-${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          arguments: --build-cache --configuration-cache

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Run dependency vulnerability scan
        run: |
          echo "🔒 Running security vulnerability scan"
          ./gradlew dependencyCheckAnalyze --build-cache --configuration-cache --no-daemon
        continue-on-error: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: build/reports/
          retention-days: 7

  # Final validation
  validate:
    name: Final Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, integration-tests, system-tests, test-coverage, quality, build, docker, security]
    # Always run to provide final status, regardless of skipped jobs
    if: always()

    steps:
      - name: Download aggregated test results
        uses: actions/download-artifact@v4
        with:
          name: aggregated-test-results

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Validate build completion
        run: |
          echo "\n📊 CI Pipeline Results Summary:"
          echo "==========================================\n"
          
          # Check what ran vs what was skipped
          if [ "${{ needs.unit-tests.outputs.run_tests }}" == "true" ]; then
            echo "✅ Unit tests: RAN (code changes detected)"
            echo "✅ Integration tests: RAN"
            echo "✅ System tests: RAN"
            echo "✅ Test coverage: GENERATED"
            echo "✅ Application: BUILT"
            echo "✅ Docker image: CREATED"
          else
            echo "⏭️ Unit tests: SKIPPED (no code changes)"
            echo "⏭️ Integration tests: SKIPPED"
            echo "⏭️ System tests: SKIPPED"
            echo "⏭️ Test coverage: SKIPPED"
            echo "⏭️ Application build: SKIPPED"
            echo "⏭️ Docker image: SKIPPED"
          fi
          
          echo "✅ Code quality checks: COMPLETED (always run)"
          echo "✅ Security scan: COMPLETED (always run)"
          echo ""
          
          # Comprehensive Cache Performance Report (SPI-475)
          echo "🗄️ Comprehensive Caching Strategy Performance:"
          echo "=============================================="
          echo ""
          echo "📊 Cache Layer Status:"
          echo "  • Gradle Dependencies: Multi-job reuse enabled"
          echo "  • Build Outputs: Smart invalidation by source changes"
