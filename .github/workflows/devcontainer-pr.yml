name: DevContainer PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.devcontainer/**'
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

concurrency:
  group: devcontainer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEVCONTAINER_CACHE_VERSION: "v1"

jobs:
  # Quick validation for fast feedback
  quick-check:
    name: Quick DevContainer Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          echo "### DevContainer PR Quick Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Validate JSON
          if jq empty .devcontainer/devcontainer.json 2>/dev/null; then
            echo "✅ devcontainer.json is valid JSON" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ devcontainer.json has invalid JSON syntax" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Check Dockerfile exists
          if [ -f .devcontainer/Dockerfile ]; then
            echo "✅ Dockerfile exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dockerfile not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Check required scripts
          scripts_ok=true
          for script in post-create.sh ci/build-and-test.sh; do
            if [ -f ".devcontainer/$script" ]; then
              echo "✅ Script exists: $script" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Script missing: $script" >> $GITHUB_STEP_SUMMARY
              scripts_ok=false
            fi
          done

          if [ "$scripts_ok" = false ]; then
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All quick checks passed! ✅" >> $GITHUB_STEP_SUMMARY

  # Fast build and essential tests only
  fast-test:
    name: Fast Build and Test
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: devcontainer-buildx-pr-${{ env.DEVCONTAINER_CACHE_VERSION }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            devcontainer-buildx-pr-${{ env.DEVCONTAINER_CACHE_VERSION }}-
            devcontainer-buildx-${{ env.DEVCONTAINER_CACHE_VERSION }}-

      - name: Build and test in DevContainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer-pr
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: |
            echo "=== Fast DevContainer Test ==="
            echo "PR: #${{ github.event.pull_request.number }}"
            echo "Branch: ${{ github.head_ref }}"
            echo ""

            # Run only essential tests for fast feedback
            echo "Running unit tests only (fast feedback)..."
            ./gradlew clean unitTest --no-daemon --no-build-cache

            echo ""
            echo "✅ Fast tests passed!"

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            const message = status === 'success'
              ? 'DevContainer quick check passed! Full CI running in parallel.'
              : 'DevContainer quick check failed. Please review the logs.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${icon} DevContainer PR Check\n\n${message}\n\n**Status:** ${status}\n**Commit:** ${context.payload.pull_request.head.sha.substring(0, 7)}`
            });

  # Build size check
  size-check:
    name: Check Build Size
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: devcontainer:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: |
          echo "### DevContainer Image Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get image size
          size=$(docker images devcontainer:pr-check --format "{{.Size}}")
          size_mb=$(docker images devcontainer:pr-check --format "{{.Size}}" | sed 's/GB/000MB/; s/MB//; s/\..*//')

          echo "**Image size:** $size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Warn if image is too large
          if [ "$size_mb" -gt 2000 ]; then
            echo "⚠️ **Warning:** Image size exceeds 2GB threshold" >> $GITHUB_STEP_SUMMARY
            echo "Consider optimizing the Dockerfile to reduce image size." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Image size is within acceptable range" >> $GITHUB_STEP_SUMMARY
          fi

          # Show layer information
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Layer information:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker history devcontainer:pr-check --human=true --format "table {{.CreatedBy}}\t{{.Size}}" | head -20 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Summary
  pr-summary:
    name: PR Check Summary
    needs: [quick-check, fast-test, size-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# DevContainer PR Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration Validation | ${{ needs.quick-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fast Tests | ${{ needs.fast-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size Check | ${{ needs.size-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quick-check.result }}" == "success" && \
                "${{ needs.fast-test.result }}" == "success" && \
                "${{ needs.size-check.result }}" == "success" ]]; then
            echo "✅ **All PR checks passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The full CI pipeline is running in parallel for comprehensive validation." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some PR checks failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed checks and update your PR." >> $GITHUB_STEP_SUMMARY
          fi
