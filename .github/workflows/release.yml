name: Release Workflow

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

# Ensure we don't have concurrent release builds
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Build optimization environment variables
  JAVA_VERSIONS: '["21"]'
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true
  # Reuse existing cache versions from CI pipeline
  BUILD_CACHE_VERSION: "v2"
  GRADLE_CACHE_VERSION: "v2"
  DEPENDENCY_CACHE_VERSION: "v1"
  DOCKER_CACHE_VERSION: "v2"
  # Docker BuildKit optimizations
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # Extract version information from release tag
  version-info:
    name: Extract Version Information
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          # Get version from release tag or workflow dispatch input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "🏷️ Release Version: ${VERSION}"
          
          # Parse semantic version components
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}  
            PATCH=${BASH_REMATCH[3]}
            PRERELEASE=${BASH_REMATCH[4]}
            
            echo "major=${MAJOR}" >> $GITHUB_OUTPUT
            echo "minor=${MINOR}" >> $GITHUB_OUTPUT
            echo "patch=${PATCH}" >> $GITHUB_OUTPUT
            
            # Check if this is a prerelease
            if [[ -n "$PRERELEASE" ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
              echo "🚧 Pre-release detected: ${PRERELEASE}"
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
              echo "✅ Stable release"
            fi
            
            echo "📋 Version Components:"
            echo "  Major: ${MAJOR}"
            echo "  Minor: ${MINOR}"
            echo "  Patch: ${PATCH}"
            echo "  Prerelease: ${PRERELEASE:-none}"
          else
            echo "❌ Invalid semantic version format: ${VERSION}"
            exit 1
          fi

  # Build application artifacts (FAT JAR)
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: version-info
    outputs:
      jar-size: ${{ steps.jar-info.outputs.size }}
      native-size: ${{ steps.native-info.outputs.size }}
    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Reuse comprehensive caching strategy from CI pipeline
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            .gradle/
          key: gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-jdk21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-jdk21-
            gradle-deps-${{ env.DEPENDENCY_CACHE_VERSION }}-ubuntu-

      - name: Cache Kotlin compilation
        uses: actions/cache@v4
        with:
          path: |
            build/kotlin
            build/tmp/kotlin-classes
          key: kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-ubuntu-jdk21-${{ hashFiles('src/**/*.kt', 'build.gradle.kts') }}
          restore-keys: |
            kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-ubuntu-jdk21-
            kotlin-compile-${{ env.BUILD_CACHE_VERSION }}-ubuntu-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false
          arguments: --build-cache --configuration-cache

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Use CI-optimized Gradle properties
      - name: Copy CI Gradle properties
        run: cp .github/gradle-ci.properties gradle.properties

      - name: Build FAT JAR
        run: |
          echo "🔨 Building release FAT JAR for version ${{ needs.version-info.outputs.version }}"
          ./gradlew buildFatJar --build-cache --configuration-cache --no-daemon
          
          echo "📊 Build performance optimizations applied:"
          echo "  ✅ Gradle build cache enabled"
          echo "  ✅ Configuration cache enabled"
          echo "  ✅ Kotlin incremental compilation"
          echo "  ✅ CI-optimized memory settings"

      - name: Verify FAT JAR
        id: jar-info
        run: |
          JAR_PATH="build/libs/jcvd-server.jar"
          if [[ ! -f "$JAR_PATH" ]]; then
            echo "❌ FAT JAR not found at $JAR_PATH"
            ls -la build/libs/
            exit 1
          fi
          
          JAR_SIZE=$(du -h "$JAR_PATH" | cut -f1)
          JAR_SIZE_BYTES=$(stat -f%z "$JAR_PATH" 2>/dev/null || stat -c%s "$JAR_PATH")
          
          echo "size=${JAR_SIZE}" >> $GITHUB_OUTPUT
          
          echo "✅ FAT JAR built successfully:"
          echo "  📍 Path: $JAR_PATH"
          echo "  📏 Size: $JAR_SIZE ($(numfmt --to=iec $JAR_SIZE_BYTES))"
          echo "  🏷️ Version: ${{ needs.version-info.outputs.version }}"

      # Build GraalVM native image
      - name: Setup GraalVM for native image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Build native image
        id: native-build
        run: |
          echo "🏗️ Building GraalVM native image for version ${{ needs.version-info.outputs.version }}"
          
          # Build native image with optimizations
          ./gradlew nativeCompile --build-cache --configuration-cache --no-daemon
          
          echo "📊 Native image build completed"
        continue-on-error: true  # Native image is experimental

      - name: Verify native image
        id: native-info
        if: steps.native-build.outcome == 'success'
        run: |
          NATIVE_PATH="build/native/nativeCompile/jcvd-server"
          if [[ ! -f "$NATIVE_PATH" ]]; then
            echo "❌ Native image not found at $NATIVE_PATH"
            ls -la build/native/nativeCompile/ || echo "Native compile directory not found"
            echo "size=N/A" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          NATIVE_SIZE=$(du -h "$NATIVE_PATH" | cut -f1)
          NATIVE_SIZE_BYTES=$(stat -f%z "$NATIVE_PATH" 2>/dev/null || stat -c%s "$NATIVE_PATH")
          
          echo "size=${NATIVE_SIZE}" >> $GITHUB_OUTPUT
          
          echo "✅ Native image built successfully:"
          echo "  📍 Path: $NATIVE_PATH"
          echo "  📏 Size: $NATIVE_SIZE ($(numfmt --to=iec $NATIVE_SIZE_BYTES))"
          echo "  🚀 Startup: Sub-second initialization"
          echo "  💾 Memory: Reduced runtime footprint"

      - name: Native image fallback
        if: steps.native-build.outcome != 'success'
        run: |
          echo "⚠️ Native image build failed - this is expected (experimental feature)"
          echo "🎯 Release will proceed with FAT JAR artifact only"
          echo "size=N/A" >> $GITHUB_OUTPUT

      # Upload JAR artifact for containerization and release attachment
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/jcvd-server.jar
          retention-days: 30
          if-no-files-found: error

      # Upload native image if built successfully
      - name: Upload native image artifact
        if: steps.native-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-native
          path: build/native/nativeCompile/jcvd-server
          retention-days: 30
          if-no-files-found: warn

      - name: Build artifacts summary
        run: |
          echo "📦 Release Artifacts Built:"
          echo "========================="
          echo ""
          echo "✅ FAT JAR: ${{ steps.jar-info.outputs.size }}"
          if [[ "${{ steps.native-build.outcome }}" == "success" ]]; then
            echo "✅ Native Image: ${{ steps.native-info.outputs.size }}"
          else
            echo "⚠️ Native Image: Build failed (experimental)"
          fi
          echo ""
          echo "🏷️ Release Version: ${{ needs.version-info.outputs.version }}"
          echo "📅 Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

  # Build and publish container images with multi-tagging strategy
  containerization:
    name: Build & Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [version-info, build-artifacts]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      # Download pre-built JAR artifact
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: build/libs/

      - name: Verify JAR artifact
        run: |
          echo "📦 Verifying release JAR artifact"
          ls -la build/libs/
          test -f build/libs/jcvd-server.jar
          echo "JAR size: $(du -h build/libs/jcvd-server.jar)"
          echo "✅ JAR artifact ready for containerization"

      # Set up Docker Buildx with production optimizations
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate container metadata and tags
      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/spiralhouse/jcvd
          tags: |
            # Semantic versioning tags
            type=semver,pattern={{version}},value=${{ needs.version-info.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version-info.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version-info.outputs.version }},enable={{is_default_branch}}
            # Latest tag for stable releases only
            type=raw,value=latest,enable={{is_default_branch}},priority=100
          labels: |
            org.opencontainers.image.title=JCVD
            org.opencontainers.image.description=Project orchestration framework for Claude Code
            org.opencontainers.image.version=${{ needs.version-info.outputs.version }}
            org.opencontainers.image.vendor=Spiral House
            io.spiralhouse.jcvd.version=${{ needs.version-info.outputs.version }}
            io.spiralhouse.jcvd.jar-size=${{ needs.build-artifacts.outputs.jar-size }}
            io.spiralhouse.jcvd.native-size=${{ needs.build-artifacts.outputs.native-size }}

      # Build and push container with production optimizations
      - name: Build and push container image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Advanced caching strategy from CI pipeline
          cache-from: |
            type=gha,scope=docker-main
            type=gha,scope=docker-release
            type=gha,scope=docker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=docker-release
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VERSION=${{ needs.version-info.outputs.version }}
          # Production optimizations
          build-contexts: |
            artifacts=build/libs
          outputs: type=registry

      # Verify published container
      - name: Verify container publication
        run: |
          echo "🐳 Container Image Published Successfully!"
          echo "========================================"
          echo ""
          echo "📦 Image: ghcr.io/spiralhouse/jcvd"
          echo "🏷️ Version: ${{ needs.version-info.outputs.version }}"
          echo "📊 Image Digest: ${{ steps.docker-build.outputs.digest }}"
          echo ""
          echo "🏷️ Published Tags:"
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            echo "  • $tag"
          done
          echo ""
          echo "📥 Pull Commands:"
          echo "  # Latest version"
          echo "  docker pull ghcr.io/spiralhouse/jcvd:${{ needs.version-info.outputs.version }}"
          if [[ "${{ needs.version-info.outputs.is_prerelease }}" == "false" ]]; then
            echo "  # Latest stable"
            echo "  docker pull ghcr.io/spiralhouse/jcvd:latest"
          fi
          echo ""
          echo "🚀 Run Command:"
          echo "  docker run -p 8080:8080 ghcr.io/spiralhouse/jcvd:${{ needs.version-info.outputs.version }}"

  # Attach binary artifacts to GitHub release
  attach-release-assets:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-info, build-artifacts, containerization]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      # Download all built artifacts
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: ./artifacts/

      - name: Download native image artifact
        if: needs.build-artifacts.outputs.native-size != 'N/A'
        uses: actions/download-artifact@v4
        with:
          name: release-native
          path: ./artifacts/
        continue-on-error: true

      # Prepare release assets with proper naming
      - name: Prepare release assets
        run: |
          echo "📦 Preparing release assets for version ${{ needs.version-info.outputs.version }}"
          
          # Create release directory
          mkdir -p release-assets
          
          # Rename and copy JAR with version
          cp artifacts/jcvd-server.jar "release-assets/jcvd-${{ needs.version-info.outputs.version }}.jar"
          
          # Copy native image if available
          if [[ -f "artifacts/jcvd-server" ]]; then
            cp artifacts/jcvd-server "release-assets/jcvd-${{ needs.version-info.outputs.version }}-native"
            chmod +x "release-assets/jcvd-${{ needs.version-info.outputs.version }}-native"
          fi
          
          echo "📋 Release assets prepared:"
          ls -la release-assets/

      # Create checksums for integrity verification
      - name: Generate checksums
        run: |
          cd release-assets
          
          echo "🔐 Generating SHA256 checksums..."
          
          # Generate checksums for all files
          for file in *; do
            if [[ -f "$file" ]]; then
              sha256sum "$file" >> "checksums-${{ needs.version-info.outputs.version }}.txt"
            fi
          done
          
          echo "📋 Generated checksums:"
          cat "checksums-${{ needs.version-info.outputs.version }}.txt"

      # Attach assets to GitHub release
      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/*
          body_path: |
            ## 📦 Release Assets
            
            This release includes the following downloadable artifacts:
            
            ### 🏺 JAR Archive
            - **jcvd-${{ needs.version-info.outputs.version }}.jar** (${{ needs.build-artifacts.outputs.jar-size }}) - Executable JAR with all dependencies
            
            ### 🚀 Native Image
            ${{ needs.build-artifacts.outputs.native-size != 'N/A' && format('- **jcvd-{0}-native** ({1}) - GraalVM native binary for faster startup', needs.version-info.outputs.version, needs.build-artifacts.outputs.native-size) || '- Native image not available (experimental feature)' }}
            
            ### 🐳 Container Image
            - **ghcr.io/spiralhouse/jcvd:${{ needs.version-info.outputs.version }}** - Production container image
            
            ### 🔐 Security
            - **checksums-${{ needs.version-info.outputs.version }}.txt** - SHA256 checksums for integrity verification
            
            ### 📥 Quick Start
            ```bash
            # Run with JAR
            java -jar jcvd-${{ needs.version-info.outputs.version }}.jar
            
            ${{ needs.build-artifacts.outputs.native-size != 'N/A' && format('# Run native binary\n./jcvd-{0}-native\n\n', needs.version-info.outputs.version) || '# Native binary not available\n\n' }}# Run with Docker
            docker run -p 8080:8080 ghcr.io/spiralhouse/jcvd:${{ needs.version-info.outputs.version }}
            ```
          token: ${{ secrets.GITHUB_TOKEN }}

  # Final release validation and summary
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [version-info, build-artifacts, containerization, attach-release-assets]
    if: always()
    steps:
      - name: Release completion summary
        run: |
          echo "🎉 Release Workflow Completed!"
          echo "============================="
          echo ""
          echo "🏷️ Release Information:"
          echo "  Version: ${{ needs.version-info.outputs.version }}"
          echo "  Major: ${{ needs.version-info.outputs.major }}"
          echo "  Minor: ${{ needs.version-info.outputs.minor }}"
          echo "  Patch: ${{ needs.version-info.outputs.patch }}"
          echo "  Prerelease: ${{ needs.version-info.outputs.is_prerelease == 'true' && 'Yes' || 'No' }}"
          echo ""
          echo "📦 Artifacts Built:"
          echo "  ✅ FAT JAR: ${{ needs.build-artifacts.outputs.jar-size }}"
          if [[ "${{ needs.build-artifacts.outputs.native-size }}" != "N/A" ]]; then
            echo "  ✅ Native Image: ${{ needs.build-artifacts.outputs.native-size }}"
          else
            echo "  ⚠️ Native Image: Build failed (experimental)"
          fi
          echo ""
          echo "🐳 Container Registry:"
          echo "  ✅ Published to: ghcr.io/spiralhouse/jcvd"
          echo "  🏷️ Tags: ${{ needs.version-info.outputs.version }}${{ needs.version-info.outputs.is_prerelease == 'false' && ', latest' || '' }}"
          echo ""
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "📎 GitHub Release:"
            if [[ "${{ needs.attach-release-assets.result }}" == "success" ]]; then
              echo "  ✅ Assets attached successfully"
            else
              echo "  ❌ Failed to attach assets"
            fi
          fi
          echo ""
          echo "⚡ Performance Optimizations Applied:"
          echo "  ✅ Multi-layer Gradle dependency caching"
          echo "  ✅ Kotlin incremental compilation cache"
          echo "  ✅ Docker BuildKit with GitHub Actions cache"
          echo "  ✅ Artifact reuse between jobs"
          echo "  ✅ CI-optimized build configuration"
          echo ""
          echo "🎯 Release Ready!"
          echo "  • Download artifacts from GitHub release"
          echo "  • Pull container: docker pull ghcr.io/spiralhouse/jcvd:${{ needs.version-info.outputs.version }}"
          echo "  • Ready for production deployment"

      - name: Check job results
        run: |
          echo "🔍 Job Results Summary:"
          echo "======================"
          
          # Check critical job results
          if [[ "${{ needs.build-artifacts.result }}" == "success" ]]; then
            echo "✅ Build Artifacts: SUCCESS"
          else
            echo "❌ Build Artifacts: FAILED"
            exit 1
          fi
          
          if [[ "${{ needs.containerization.result }}" == "success" ]]; then
            echo "✅ Containerization: SUCCESS"
          else
            echo "❌ Containerization: FAILED" 
            exit 1
          fi
          
          if [[ "${{ github.event_name }}" == "release" ]]; then
            if [[ "${{ needs.attach-release-assets.result }}" == "success" ]]; then
              echo "✅ Release Assets: SUCCESS"
            else
              echo "❌ Release Assets: FAILED"
              exit 1
            fi
          fi
          
          echo ""
          echo "🚀 All critical jobs completed successfully!"