# Dependency Review Configuration for JCVD (AGPL-3.0)
#
# This configuration ensures dependencies are compatible with AGPL-3.0
# and maintains security standards for the project.
#
# Using allow-list approach: only explicitly approved licenses are permitted.

# Security Settings - fail on critical and high severity vulnerabilities
fail_on_severity: 'high'

# Scopes to check
fail_on_scopes:
  - 'runtime'
  - 'development'

# Enable vulnerability and license checking
vulnerability_check: true
license_check: true

# AGPL-3.0 Compatible Licenses (ALLOW-LIST ONLY)
# Only these licenses are permitted for dependencies
allow_licenses:
  # Permissive licenses (compatible with AGPL-3.0)
  - 'MIT'
  - 'Apache-2.0'
  - 'BSD-2-Clause'
  - 'BSD-3-Clause'
  - 'ISC'
  - '0BSD'
  
  # AGPL/GPL family (same or compatible)
  - 'AGPL-3.0'
  - 'AGPL-3.0-only'
  - 'AGPL-3.0-or-later'
  - 'GPL-3.0'
  - 'GPL-3.0-only'
  - 'GPL-3.0-or-later'
  - 'GPL-2.0-or-later'
  
  # LGPL (compatible with AGPL-3.0)
  - 'LGPL-3.0'
  - 'LGPL-3.0-only'
  - 'LGPL-3.0-or-later'
  - 'LGPL-2.1'
  - 'LGPL-2.1-only'
  - 'LGPL-2.1-or-later'
  
  # Creative Commons (for documentation/assets)
  - 'CC0-1.0'
  - 'CC-BY-4.0'
  
  # Public Domain
  - 'Unlicense'
  - 'WTFPL'

# Note: This allow-list approach means that:
# - GPL-2.0-only is automatically blocked (not in allow list)
# - Proprietary licenses are automatically blocked (not in allow list)  
# - Commercial licenses are automatically blocked (not in allow list)
# - Any license not explicitly listed above will fail the check
# 
# This provides stronger protection for AGPL-3.0 compatibility than a deny-list approach.