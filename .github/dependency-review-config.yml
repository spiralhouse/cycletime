# Dependency Review Configuration for JCVD (AGPL-3.0)
#
# This configuration ensures dependencies are compatible with AGPL-3.0
# and maintains security standards for the project.

# Security Settings - fail on critical and high severity vulnerabilities
fail_on_severity: 'high'

# Scopes to check
fail_on_scopes:
  - 'runtime'
  - 'development'

# Enable vulnerability and license checking
vulnerability_check: true
license_check: true

# AGPL-3.0 Compatible Licenses
# These licenses are generally compatible with AGPL-3.0
allow_licenses:
  # Permissive licenses (compatible with AGPL-3.0)
  - 'MIT'
  - 'Apache-2.0'
  - 'BSD-2-Clause'
  - 'BSD-3-Clause'
  - 'ISC'
  - '0BSD'
  
  # AGPL/GPL family (same or compatible)
  - 'AGPL-3.0'
  - 'AGPL-3.0-only'
  - 'AGPL-3.0-or-later'
  - 'GPL-3.0'
  - 'GPL-3.0-only'
  - 'GPL-3.0-or-later'
  - 'GPL-2.0-or-later'
  
  # LGPL (compatible with AGPL-3.0)
  - 'LGPL-3.0'
  - 'LGPL-3.0-only'
  - 'LGPL-3.0-or-later'
  - 'LGPL-2.1'
  - 'LGPL-2.1-only'
  - 'LGPL-2.1-or-later'
  
  # Creative Commons (for documentation/assets)
  - 'CC0-1.0'
  - 'CC-BY-4.0'
  
  # Public Domain
  - 'Unlicense'
  - 'WTFPL'

# Licenses that are NOT compatible with AGPL-3.0
# Using only valid SPDX license identifiers
deny_licenses:
  # GPL-2.0 only (incompatible with AGPL-3.0 due to version conflict)
  - 'GPL-2.0'
  - 'GPL-2.0-only'
  
  # Restrictive licenses
  - 'JSON'
  
  # Non-commercial licenses (incompatible with AGPL-3.0's freedom principles)
  - 'CC-BY-NC-4.0'
  - 'CC-BY-NC-SA-4.0'

# Note: Proprietary, commercial, and custom licenses cannot be specified here
# as they don't have standard SPDX identifiers. The action will flag
# any unlicensed or unrecognized licenses automatically.