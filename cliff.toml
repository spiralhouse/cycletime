# git-cliff Configuration for CycleTime CE
# SPI-820: Beautiful, icon-based release notes generation
# Documentation: https://git-cliff.org/docs/configuration

[changelog]
# Changelog header - shown at the top of every release
header = """
# Changelog\n
All notable changes to CycleTime CE will be documented automatically in GitHub Releases.
This project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

# Template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor %}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

# Remove the leading and trailing whitespace from the templates
trim = true

# Postprocessors - clean up generated changelog
postprocessors = [
  # Replace repository URL with actual GitHub URL
  { pattern = '\$REPO', replace = "https://github.com/spiralhouse/cycletime" },
  # Replace issue markers with links
  { pattern = '\(#([0-9]+)\)', replace = "([#$1](https://github.com/spiralhouse/cycletime/pull/$1))" },
  # Replace SPI issue markers with links
  { pattern = 'SPI-([0-9]+)', replace = "[SPI-$1](https://linear.app/spiral-house/issue/SPI-$1)" },
]

[git]
# Parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# Filter out commits that are not conventional
filter_unconventional = false
# Process each line of a commit as an individual commit
split_commits = false
# Regex for preprocessing commit messages
commit_preprocessors = [
  # Remove gitmoji from commit messages
  { pattern = '\s*\(?\w*\)?', replace = "" },
]

# Protect breaking changes by putting them at the top of the changelog
protect_breaking_commits = true

# Filter out commits based on regex patterns
filter_commits = true

# Regex for matching git tags
tag_pattern = "v[0-9].*"

# Skip tags based on regex
# skip_tags = "v0.1.0-beta.1"

# Ignore tags with specific patterns
# ignore_tags = ""

# Sort commits inside sections by oldest/newest order
topo_order = false
# Sort commits topologically
sort_commits = "oldest"

[git.commit_parsers]
# === Priority: Breaking Changes ===
# Breaking changes appear first regardless of type
{ message = "^\\w+\\(.*\\)!:", group = "🚨 BREAKING CHANGES" },
{ message = "^\\w+!:", group = "🚨 BREAKING CHANGES" },
{ message = "^BREAKING[ -]CHANGE:", group = "🚨 BREAKING CHANGES" },

# === User-Facing Changes (Main Release Notes) ===
# Features
{ message = "^feat\\(ui\\)", group = "✨ User Interface" },
{ message = "^feat\\(dashboard\\)", group = "✨ Dashboard" },
{ message = "^feat\\(mcp\\)", group = "✨ MCP Integration" },
{ message = "^feat\\(api\\)", group = "✨ API" },
{ message = "^feat", group = "✨ Features" },

# Bug Fixes
{ message = "^fix\\(mcp\\)", group = "🐛 Bug Fixes - MCP" },
{ message = "^fix\\(ui\\)", group = "🐛 Bug Fixes - UI" },
{ message = "^fix\\(cache\\)", group = "🐛 Bug Fixes - Cache" },
{ message = "^fix", group = "🐛 Bug Fixes" },

# Performance
{ message = "^perf", group = "⚡ Performance Improvements" },

# Security
{ message = "^security", group = "🔒 Security" },

# === Developer-Facing Changes ===
# Documentation
{ message = "^docs", group = "📚 Documentation" },

# Refactoring
{ message = "^refactor", group = "♻️ Code Refactoring" },

# Testing
{ message = "^test", group = "🧪 Testing" },

# === Infrastructure Changes (Collapsed Section) ===
# Build System (excluding dependency updates)
{ message = "^build(?!\\(deps\\)).*", group = "📦 Build System" },

# CI/CD
{ message = "^ci", group = "⚙️ Continuous Integration" },

# === Dependency Updates (Always Collapsed) ===
# Group all dependency updates together
{ message = "^build\\(deps\\)", group = "📦 Dependencies", default_scope = "deps" },

# === Maintenance (Filtered Out) ===
# Chores - skip from release notes
{ message = "^chore", skip = true },

# Reverts
{ message = "^revert", group = "⏪ Reverts" },

# Style changes - skip from release notes
{ message = "^style", skip = true },

# === Catch-All ===
# Any other commits
{ message = ".*", group = "📝 Other Changes" },

[remote.github]
# GitHub remote configuration for linking
owner = "spiralhouse"
repo = "cycletime"
