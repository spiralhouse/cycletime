<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="pyramidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Pyramid sections -->
  <g filter="url(#dropShadow)">
    <!-- System Tests (top) - 5% -->
    <path d="M 200 40 L 220 80 L 180 80 Z" 
          fill="#e74c3c" 
          stroke="#c0392b" 
          stroke-width="1.5"/>
    
    <!-- Integration Tests (middle) - 25% -->
    <path d="M 180 80 L 220 80 L 260 160 L 140 160 Z" 
          fill="#f39c12" 
          stroke="#d68910" 
          stroke-width="1.5"/>
    
    <!-- Unit Tests (bottom) - 70% -->
    <path d="M 140 160 L 260 160 L 340 260 L 60 260 Z" 
          fill="#27ae60" 
          stroke="#229954" 
          stroke-width="1.5"/>
  </g>
  
  <!-- Section lines for visual separation -->
  <line x1="180" y1="80" x2="220" y2="80" stroke="#2c3e50" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.5"/>
  <line x1="140" y1="160" x2="260" y2="160" stroke="#2c3e50" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.5"/>
  
  <!-- Labels and descriptions -->
  <g font-family="'Segoe UI', Arial, sans-serif" fill="#2c3e50">
    <!-- System Tests -->
    <text x="200" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      System Tests (5%)
    </text>
    <text x="320" y="60" text-anchor="start" font-size="11" fill="#e74c3c">
      • End-to-end workflows
    </text>
    <text x="320" y="75" text-anchor="start" font-size="11" fill="#e74c3c">
      • Production scenarios
    </text>
    
    <!-- Integration Tests -->
    <text x="200" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Integration Tests (25%)
    </text>
    <text x="320" y="115" text-anchor="start" font-size="11" fill="#f39c12">
      • Real components
    </text>
    <text x="320" y="130" text-anchor="start" font-size="11" fill="#f39c12">
      • Database operations
    </text>
    
    <!-- Unit Tests -->
    <text x="200" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      Unit Tests (70%)
    </text>
    <text x="320" y="210" text-anchor="start" font-size="11" fill="#27ae60">
      • Business logic
    </text>
    <text x="320" y="225" text-anchor="start" font-size="11" fill="#27ae60">
      • Fast, isolated
    </text>
  </g>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="18" font-weight="bold" fill="#2c3e50">
    Test Pyramid Architecture
  </text>
  
  <!-- Legend arrows showing test speed -->
  <g opacity="0.7">
    <!-- Fast arrow (bottom) -->
    <path d="M 30 240 L 30 220" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="25" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#27ae60">Fast</text>
    
    <!-- Slow arrow (top) -->
    <path d="M 30 80 L 30 100" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="25" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e74c3c">Slow</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#27ae60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,10 10,5 0,0" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>