ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    
    application {
        modules = [ com.spiralhouse.jcvd.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:sqlite:jcvd.db"
    url = ${?DATABASE_URL}
    driver = "org.sqlite.JDBC"
    maxPoolSize = 10
    logging = false
    logging = ${?DATABASE_LOGGING}
}

mcp {
    server {
        name = "jcvd-kotlin"
        version = "0.1.0"
        description = "JCVD Project Orchestration MCP Server (Kotlin)"
    }
}