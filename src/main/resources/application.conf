ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
        
        # Development mode configuration
        watch = []
        watch = ${?KTOR_WATCH_PATHS}
        
        # Auto-reload configuration for development
        autoreload = true
        autoreload = ${?KTOR_AUTORELOAD}
        
        # Development watch paths
        development = true
        development = ${?KTOR_DEVELOPMENT}
    }

    application {
        modules = [ io.spiralhouse.cycletime.ApplicationKt.module ]
    }
    
    # Development-specific configuration
    development {
        # Watch these paths for automatic reload
        watchPaths = [
            "build/classes/kotlin/main",
            "src/main/kotlin",
            "src/main/resources"
        ]
        watchPaths = ${?KTOR_DEV_WATCH_PATHS}
        
        # Automatic reload on source changes
        autoreload = true
    }
}

database {
    # H2 embedded database configuration (PostgreSQL compatibility mode)
    # Note: DB_CLOSE_DELAY=-1 is not needed for file-based databases and can cause shutdown issues
    url = "jdbc:h2:file:./cycletime;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    url = ${?DATABASE_URL}
    driver = "org.h2.Driver"
    driver = ${?DATABASE_DRIVER}
    maxPoolSize = 10
    logging = false
    logging = ${?DATABASE_LOGGING}
}

mcp {
    server {
        name = "cycletime"
        version = ${?CYCLETIME_VERSION}
        description = "CycleTime Project Orchestration MCP Server (Kotlin)"
    }
}

oauth {
    github {
        clientId = ${?GITHUB_CLIENT_ID}
        clientSecret = ${?GITHUB_CLIENT_SECRET}
        callbackUrl = ${?GITHUB_CALLBACK_URL}
    }
}

session {
    secret = ${?SESSION_SECRET}
    maxAgeSeconds = 604800  # 7 days
}
