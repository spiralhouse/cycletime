# =============================================================================
# Kotest Configuration for TestPlan Registration Coordination (SPI-624)
# =============================================================================
# This configuration addresses race conditions in Kotest TestPlan registration
# that occur when multiple Gradle Test Executors initialize concurrently.
#
# Key Principle: Sequential discovery phase, parallel execution phase
# This maintains performance while preventing TestIdentifier registration issues.
# =============================================================================

# Discovery phase coordination - prevents TestPlan registration race conditions
kotest.framework.discovery.parallel=false
kotest.framework.discovery.timeout=30000

# Test execution parallelism - maintains performance
kotest.framework.parallelism=4
kotest.framework.timeout=60000
kotest.framework.invocation.timeout=30000

# Classpath scanning optimization - reduces initialization overhead
kotest.framework.classpath.scanning.autoscan.disable=false

# Debugging (can be enabled for troubleshooting TestPlan issues)
# kotest.framework.debug=false